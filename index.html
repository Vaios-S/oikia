<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OIKIA | Dashboard</title>
    <link rel="stylesheet" href="./css/main.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>OIKIA</h1>
      <button id="logoutBtn">Logout</button>
    </header>

    <main class="container">
      <section class="card">
        <h2>Productivity</h2>

        <form id="taskForm">
          <input
            type="text"
            id="taskInput"
            placeholder="Add a new task..."
            required
          />
          <button type="submit">Add</button>
        </form>

        <ul id="taskList"></ul>
      </section>
      <section class="card">
        <h2>Finance</h2>
        <p>Finance tools will live here.</p>
      </section>
    </main>

    <script src="js/guard.js"></script>
    <script src="./js/tasks.js"></script>
  </body>
</html>
